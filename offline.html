<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#F77F00">
<title>Offline - Manaba POS</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#fff7e8,#ffebc2);color:#3b2112;text-align:center}.card{width:min(420px,100%);padding:24px;border-radius:32px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.80);box-shadow:0 22px 60px rgba(59,33,18,.18)}.logo{width:84px;height:84px;margin:0 auto 14px;display:grid;place-items:center;border-radius:28px;background:linear-gradient(135deg,#ffd166,#f77f00);font-size:38px}h1{margin:0 0 8px;font-size:24px}p{margin:0;color:#6b3f22;font-weight:700;line-height:1.55}button{margin-top:18px;min-height:50px;width:100%;border:0;border-radius:18px;background:linear-gradient(135deg,#ffd166,#f77f00);color:#3b2112;font-weight:900;font-size:15px}
</style>
</head>
<body>
<div class="card"><div class="logo">📶</div><h1>Aplikasi sedang offline</h1><p>Wrapper PWA masih bisa terbuka, tetapi data kasir dari Google Apps Script membutuhkan koneksi internet.</p><button onclick="location.reload()">Coba Lagi</button></div>
</body>
</html>
